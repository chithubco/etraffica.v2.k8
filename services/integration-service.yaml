apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-service
  namespace: etraffica
  labels:
    app: integration-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: integration-service
  template:
    metadata:
      labels:
        app: integration-service
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: integration-service
          image: 0680/etraffica.v2.integration-service:30.06.26.01
          imagePullPolicy: Always
          ports:
            - containerPort: 4311
              name: http
          envFrom:
            - configMapRef:
                name: etraffica-config
            - secretRef:
                name: etraffica-secrets
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 4311
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 4311
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: integration-service
  namespace: etraffica
  labels:
    app: integration-service
spec:
  type: ClusterIP
  selector:
    app: integration-service
  ports:
    - name: http
      port: 4311
      targetPort: 4311
