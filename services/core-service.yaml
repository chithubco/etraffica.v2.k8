# core-service is an OPTIONAL legacy composite runtime (eTrafficaBE compatibility).
# It is NOT routed by the api-gateway and embeds the split services internally; deploy
# only if you need the legacy surface. Image namespace differs (etraffica.api.core).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: etraffica
  labels:
    app: core-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: core-service
          image: 0680/etraffica.api.core:26.06.26.01
          imagePullPolicy: Always
          ports:
            - containerPort: 4323
              name: http
          envFrom:
            - configMapRef:
                name: etraffica-config
            - secretRef:
                name: etraffica-secrets
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 4323
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 4323
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: etraffica
  labels:
    app: core-service
spec:
  type: ClusterIP
  selector:
    app: core-service
  ports:
    - name: http
      port: 4323
      targetPort: 4323
