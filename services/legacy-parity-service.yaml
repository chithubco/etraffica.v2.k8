apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-parity-service
  namespace: etraffica
  labels:
    app: legacy-parity-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: legacy-parity-service
  template:
    metadata:
      labels:
        app: legacy-parity-service
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: legacy-parity-service
          image: 0680/etraffica.v2.legacy-parity-service:26.06.26.01
          imagePullPolicy: Always
          ports:
            - containerPort: 4322
              name: http
          envFrom:
            - configMapRef:
                name: etraffica-config
            - secretRef:
                name: etraffica-secrets
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 4322
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 4322
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-parity-service
  namespace: etraffica
  labels:
    app: legacy-parity-service
spec:
  type: ClusterIP
  selector:
    app: legacy-parity-service
  ports:
    - name: http
      port: 4322
      targetPort: 4322
