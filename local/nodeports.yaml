# Local-only NodePort services exposing the api-gateway and the four frontends on the host.
# These are ADDITIONAL services (suffix -nodeport) so the original ClusterIP services that the
# ingress and internal service-to-service routing depend on stay untouched.
#
#   kubectl apply -f k8/local/nodeports.yaml
#
# Reachable at <host-ip>:<nodePort> (Docker Desktop forwards NodePorts to the host).
# NodePort range is 30000-32767.
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-nodeport
  namespace: etraffica
  labels:
    app: api-gateway
    expose: nodeport
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 4300
      targetPort: 4300
      nodePort: 30300
---
apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
  namespace: etraffica
  labels:
    app: web
    expose: nodeport
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30000
---
apiVersion: v1
kind: Service
metadata:
  name: admin-web-nodeport
  namespace: etraffica
  labels:
    app: admin-web
    expose: nodeport
spec:
  type: NodePort
  selector:
    app: admin-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: violator-web-nodeport
  namespace: etraffica
  labels:
    app: violator-web
    expose: nodeport
spec:
  type: NodePort
  selector:
    app: violator-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: product-website-nodeport
  namespace: etraffica
  labels:
    app: product-website
    expose: nodeport
spec:
  type: NodePort
  selector:
    app: product-website
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30082
