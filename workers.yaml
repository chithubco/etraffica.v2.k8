# Background workers — pure RabbitMQ consumers. No HTTP port, so no Service and no
# HTTP probe. Each image bakes its own start script (SERVICE_START_SCRIPT=worker:<x>).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-outbox
  namespace: etraffica
  labels:
    app: worker-outbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-outbox
  template:
    metadata:
      labels:
        app: worker-outbox
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: worker-outbox
          image: 0680/etraffica.worker.outbox:29.06.26.01
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: etraffica-config
            - secretRef:
                name: etraffica-secrets
          resources:
            requests:
              cpu: "25m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "384Mi"
